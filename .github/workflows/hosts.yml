name: Live hosts

# Every plugin installed into the real application it is for, asked for subtitles for
# a film and an episode against the live API, and made to download one, the way a
# user would. The servers are pulled and set up from nothing and it leans on the API
# and a few package mirrors, so it runs when asked, not on every push:
# Actions > Live hosts > Run workflow. plugins/hosts/README.md says what each job does.

on:
  workflow_dispatch:
    inputs:
      host:
        description: Which host to run
        type: choice
        options: [all, jellyfin, emby, kodi, vlc, bazarr]
        default: all
      repository:
        description: >-
          A Jellyfin repository to install from, such as
          https://cdn.thesubtitledb.org/plugins/jellyfin/manifest.json. Empty builds one
          from this commit.
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: hosts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    # The API's answer for every sample by every route a host takes, and whether it
    # is the right title. Runs whichever host is picked: it is what the rest are
    # measured against.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: The API, for every sample, by every route
        run: python3 plugins/hosts/baseline.py

  jellyfin:
    if: ${{ (inputs.host || 'all') == 'all' || inputs.host == 'jellyfin' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The ABI the plugin is built against, the last 10.x, and the current release.
        version: ['10.10.7', '10.11.11', '12.1']
    steps:
      - uses: actions/checkout@v5

      - name: What the API has for the samples
        # Its verdict is the api job's. Here it is context for a host that finds nothing.
        continue-on-error: true
        run: python3 plugins/hosts/baseline.py

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet

      # The repository a release publishes, built by the same command with another URL:
      # the one the server's container reaches the runner by.
      - name: Build the plugin and its repository
        run: python3 tools/build-plugins.py --host jellyfin --repo http://host.docker.internal:8000
        working-directory: plugins/dotnet

      - name: Sample library
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg; }
          python3 plugins/hosts/media.py "$RUNNER_TEMP/media"

      - name: Start Jellyfin ${{ matrix.version }} and serve the repository
        run: |
          mkdir -p "$RUNNER_TEMP/config/config" "$RUNNER_TEMP/cache"
          # The plugin logs its searches at Debug; the server's own default is Information.
          echo '{"Serilog":{"MinimumLevel":{"Override":{"SubtitleDb":"Debug"}}}}' \
            > "$RUNNER_TEMP/config/config/logging.json"
          nohup python3 -m http.server 8000 --directory plugins/dotnet/dist/repo \
            > "$RUNNER_TEMP/repo.log" 2>&1 &
          docker run -d --name host -p 8096:8096 --add-host host.docker.internal:host-gateway \
            -v "$RUNNER_TEMP/config:/config" -v "$RUNNER_TEMP/cache:/cache" \
            -v "$RUNNER_TEMP/media:/media" jellyfin/jellyfin:${{ matrix.version }}

      - name: Install from the repository, search and download through Jellyfin
        env:
          REPOSITORY: ${{ inputs.repository }}
        run: >-
          python3 plugins/hosts/mediaserver.py jellyfin http://localhost:8096 "$RUNNER_TEMP/media"
          --repository "${REPOSITORY:-http://host.docker.internal:8000/manifest.json}"

      - name: Server log
        if: always()
        run: |
          cat "$RUNNER_TEMP/repo.log" || true
          docker logs host 2>&1 | grep -iE 'subtitledb|subtitle|exception|\[ERR\]|\[WRN\]' | tail -100 || true

  emby:
    if: ${{ (inputs.host || 'all') == 'all' || inputs.host == 'emby' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The version the plugin is built against, the last 4.9, and the current release.
        version: ['4.8.11.0', '4.9.5.0', '4.10.0.40']
    steps:
      - uses: actions/checkout@v5

      - name: What the API has for the samples
        # Its verdict is the api job's. Here it is context for a host that finds nothing.
        continue-on-error: true
        run: python3 plugins/hosts/baseline.py

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet

      - name: Build the plugin
        run: python3 tools/build-plugins.py --host emby
        working-directory: plugins/dotnet

      - name: Sample library
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg; }
          python3 plugins/hosts/media.py "$RUNNER_TEMP/media"

      - name: Start Emby ${{ matrix.version }} with the plugin
        run: |
          mkdir -p "$RUNNER_TEMP/config/plugins"
          cp plugins/dotnet/dist/emby/SubtitleDb.Emby.dll "$RUNNER_TEMP/config/plugins/"
          docker run -d --name host --network host -e UID="$(id -u)" -e GID="$(id -g)" \
            -v "$RUNNER_TEMP/config:/config" -v "$RUNNER_TEMP/media:/media" \
            emby/embyserver:${{ matrix.version }}

      - name: Search and download through Emby
        run: python3 plugins/hosts/mediaserver.py emby http://localhost:8096 "$RUNNER_TEMP/media"

      - name: The settings file the README names
        # Emby has no settings page for a plugin without one, so the README sends
        # people to this file. The search step set the count through the API.
        run: grep -H '<PerLanguage>' "$RUNNER_TEMP/config/plugins/configurations/SubtitleDb.Emby.xml"

      - name: Server log
        if: always()
        run: |
          log=$(ls -t "$RUNNER_TEMP"/config/logs/embyserver*.txt 2>/dev/null | head -1)
          if [ -n "$log" ]; then
            grep -ihE -A3 'subtitledb|exception|error' "$log" \
              | grep -vE 'Copying plugin|ffdetect' | tail -80 || true
          else
            docker logs host 2>&1 | tail -100
          fi

  kodi:
    if: ${{ (inputs.host || 'all') == 'all' || inputs.host == 'kodi' }}
    runs-on: ${{ matrix.os }}
    # Every video plays twice, by path and from the library, in up to three languages.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 22.04's own package, Kodi 19, the oldest the addon supports, and
        # Flathub's, which follows the current release.
        include:
          - from: ubuntu
            os: ubuntu-22.04
          - from: flathub
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: What the API has for the samples
        # Its verdict is the api job's. Here it is context for a host that finds nothing.
        continue-on-error: true
        run: python3 plugins/hosts/baseline.py

      - name: Install Kodi from ${{ matrix.from }}
        run: |
          sudo apt-get update -qq
          if [ "${{ matrix.from }}" = ubuntu ]; then
            sudo apt-get install -y -qq kodi xvfb ffmpeg
            apt-cache policy kodi | sed -n '1,3p'
            # Not KODI_HOME: Kodi reads that as where its own files live, and with it
            # pointed at the data directory it segfaults before the web server is up.
            echo "KODI_DATA=$HOME/.kodi" >> "$GITHUB_ENV"
            echo "KODI_RUN=kodi" >> "$GITHUB_ENV"
          else
            sudo apt-get install -y -qq flatpak xvfb ffmpeg dbus-daemon
            flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
            flatpak install --user -y --noninteractive flathub tv.kodi.Kodi
            flatpak info --user tv.kodi.Kodi | sed -n '1,8p'
            echo "KODI_DATA=$HOME/.var/app/tv.kodi.Kodi/data" >> "$GITHUB_ENV"
            echo "KODI_RUN=dbus-run-session -- flatpak run --filesystem=$RUNNER_TEMP/media --env=KODI_AE_SINK=ALSA tv.kodi.Kodi" >> "$GITHUB_ENV"
          fi

      - name: Build the addon
        run: python3 build.py
        working-directory: plugins/kodi

      - name: Sample library
        run: python3 plugins/hosts/media.py "$RUNNER_TEMP/media"

      - name: Start Kodi with the addon
        run: |
          mkdir -p "$KODI_DATA/userdata" "$KODI_DATA/addons"
          cp plugins/hosts/kodi/*.xml "$KODI_DATA/userdata/"
          # The media folders as video sources, read once at start. kodi.py sets
          # their content later, which is what makes the library scan read them.
          cat > "$KODI_DATA/userdata/sources.xml" <<EOF
          <sources>
            <video>
              <source><name>Films</name><path pathversion="1">$RUNNER_TEMP/media/movies/</path></source>
              <source><name>Shows</name><path pathversion="1">$RUNNER_TEMP/media/tv/</path></source>
            </video>
          </sources>
          EOF
          unzip -q plugins/kodi/dist/service.subtitles.subtitledb-*.zip -d "$KODI_DATA/addons/"
          # The runners have no sound card. Told to use ALSA, Kodi finds no device and
          # plays on without sound.
          KODI_AE_SINK=ALSA nohup xvfb-run -a -s "-screen 0 1280x720x24" $KODI_RUN \
            > "$RUNNER_TEMP/kodi.out" 2>&1 &

      - name: Search and download through Kodi
        run: python3 plugins/hosts/kodi.py http://localhost:8080/jsonrpc "$RUNNER_TEMP/media" "$KODI_DATA/temp/kodi.log"

      - name: Kodi log
        if: failure()
        run: |
          tail -120 "$KODI_DATA/temp/kodi.log" || find "$HOME" -name kodi.log 2>/dev/null
          tail -40 "$RUNNER_TEMP/kodi.out" || true
          head -80 "$HOME"/kodi_crashlog-*.log 2>/dev/null || true

  bazarr:
    if: ${{ (inputs.host || 'all') == 'all' || inputs.host == 'bazarr' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: What the API has for the samples
        # Its verdict is the api job's. Here it is context for a host that finds nothing.
        continue-on-error: true
        run: python3 plugins/hosts/baseline.py

      - name: Sample library
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg; }
          python3 plugins/hosts/media.py "$RUNNER_TEMP/media"

      - name: Start Radarr, Sonarr and Bazarr
        run: |
          mkdir -p "$RUNNER_TEMP/radarr" "$RUNNER_TEMP/sonarr" "$RUNNER_TEMP/bazarr/config"
          cp plugins/hosts/bazarr/radarr.xml "$RUNNER_TEMP/radarr/config.xml"
          cp plugins/hosts/bazarr/sonarr.xml "$RUNNER_TEMP/sonarr/config.xml"
          cp plugins/hosts/bazarr/config.yaml "$RUNNER_TEMP/bazarr/config/config.yaml"
          # The same paths in all three, so a path Radarr or Sonarr reports is one
          # Bazarr can open.
          common="--network host -e PUID=$(id -u) -e PGID=$(id -g) -e TZ=Etc/UTC
            -v $RUNNER_TEMP/media/movies:/movies -v $RUNNER_TEMP/media/tv:/tv"
          docker run -d --name radarr $common -v "$RUNNER_TEMP/radarr:/config" lscr.io/linuxserver/radarr:6.4.4
          docker run -d --name sonarr $common -v "$RUNNER_TEMP/sonarr:/config" lscr.io/linuxserver/sonarr:4.0.20
          # The count per language every host is set to. Bazarr's settings page has no
          # field for it, so the provider reads it from the environment.
          per_language=$(cd plugins/hosts && python3 -c 'import media; print(media.PER_LANGUAGE)')
          docker run -d --name bazarr $common -v "$RUNNER_TEMP/bazarr:/config" \
            -e SUBTITLEDB_PER_LANGUAGE="$per_language" \
            -v "$PWD/plugins:/plugins:ro" lscr.io/linuxserver/bazarr:1.6.1

      - name: Install the provider the way its README says
        run: |
          for _ in $(seq 60); do
            docker exec bazarr test -d /app/bazarr/bin/custom_libs/subliminal_patch/providers && break
            sleep 2
          done
          docker exec bazarr python3 /plugins/bazarr/install.py /app/bazarr/bin
          # Bazarr lists its providers directory once, when it starts.
          docker restart bazarr

      - name: Search and download through Bazarr
        run: python3 plugins/hosts/bazarr.py "$RUNNER_TEMP/media"

      - name: Bazarr log
        if: always()
        run: |
          log="$RUNNER_TEMP/bazarr/log/bazarr.log"
          if [ -f "$log" ]; then
            grep -iE -A8 'subtitledb|traceback' "$log" | tail -120
          else
            docker logs bazarr 2>&1 | tail -80
          fi

  vlc:
    if: ${{ (inputs.host || 'all') == 'all' || inputs.host == 'vlc' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: What the API has for the samples
        # Its verdict is the api job's. Here it is context for a host that finds nothing.
        continue-on-error: true
        run: python3 plugins/hosts/baseline.py

      - name: Install VLC
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends vlc-bin vlc-plugin-base ffmpeg
          apt-cache policy vlc-bin | sed -n '1,3p'

      - name: Sample library
        run: python3 plugins/hosts/media.py "$RUNNER_TEMP/media" > "$RUNNER_TEMP/videos.txt"

      - name: Search and download through VLC
        run: bash plugins/hosts/vlc/run.sh "$RUNNER_TEMP/videos.txt" "$RUNNER_TEMP/vlc"

  vlc-windows:
    # The same extension in VLC on Windows, where a file's URI carries a drive
    # letter and a file's name goes through the system code page: the two things
    # the extension gets wrong when it is only ever run on Linux.
    if: ${{ (inputs.host || 'all') == 'all' || inputs.host == 'vlc' }}
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: What the API has for the samples
        # Its verdict is the api job's. Here it is context for a host that finds nothing.
        continue-on-error: true
        run: python plugins/hosts/baseline.py

      - name: Install VLC
        run: |
          choco install vlc -y --no-progress --limit-output
          command -v ffmpeg > /dev/null || choco install ffmpeg -y --no-progress --limit-output
          ls "/c/Program Files/VideoLAN/VLC/vlc.exe"

      - name: Sample library
        run: python plugins/hosts/media.py "$RUNNER_TEMP/media" > "$RUNNER_TEMP/videos.txt"

      - name: Search and download through VLC
        run: bash plugins/hosts/vlc/run.sh "$RUNNER_TEMP/videos.txt" "$RUNNER_TEMP/vlc"
        env:
          VLC: /c/Program Files/VideoLAN/VLC/vlc.exe
