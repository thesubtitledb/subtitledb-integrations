version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      npm:
        applies-to: version-updates
        patterns: ['*']
      npm-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: github-actions
    directories:
      - /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ['*']