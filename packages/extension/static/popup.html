<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<meta name="color-scheme" content="dark light">
<title>TheSubtitleDB</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header class="nav">
  <button class="back" id="backBtn" type="button" hidden>
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4 6.5 10l6 6"/></svg><span data-i18n="nav.back">Back</span>
  </button>
  <span class="brand" id="brand">
    <svg class="mark" viewBox="0 0 28 28" width="22" height="22" aria-hidden="true"><rect x="1.4" y="1.4" width="25.2" height="25.2" rx="6.4" fill="none" stroke="currentColor" stroke-width="2.6"/><rect x="7" y="17.6" width="14" height="3.2" rx="1.6" fill="currentColor"/></svg>
  </span>
  <h1 class="nav-title" id="navTitle" data-i18n="title">Subtitles</h1>
  <div class="nav-end" id="navEnd">
    <button class="pill icon" id="lookBtn" type="button" aria-expanded="false" aria-controls="look" data-i18n-label="style.open">Aa</button>
    <button class="pill icon" id="setBtn" type="button" aria-expanded="false" aria-controls="settings" data-i18n-label="settings.open">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 12.6a2.6 2.6 0 1 0 0-5.2 2.6 2.6 0 0 0 0 5.2Z"/><path d="M16.2 12.2a1.3 1.3 0 0 0 .26 1.43l.05.05a1.6 1.6 0 1 1-2.26 2.26l-.05-.05a1.3 1.3 0 0 0-1.43-.26 1.3 1.3 0 0 0-.79 1.19v.14a1.6 1.6 0 0 1-3.2 0v-.07a1.3 1.3 0 0 0-.85-1.19 1.3 1.3 0 0 0-1.43.26l-.05.05a1.6 1.6 0 1 1-2.26-2.26l.05-.05a1.3 1.3 0 0 0 .26-1.43 1.3 1.3 0 0 0-1.19-.79H3.1a1.6 1.6 0 0 1 0-3.2h.07a1.3 1.3 0 0 0 1.19-.85 1.3 1.3 0 0 0-.26-1.43l-.05-.05A1.6 1.6 0 1 1 6.31 4.1l.05.05a1.3 1.3 0 0 0 1.43.26h.06a1.3 1.3 0 0 0 .79-1.19V3.1a1.6 1.6 0 0 1 3.2 0v.07a1.3 1.3 0 0 0 .79 1.19 1.3 1.3 0 0 0 1.43-.26l.05-.05a1.6 1.6 0 1 1 2.26 2.26l-.05.05a1.3 1.3 0 0 0-.26 1.43v.06a1.3 1.3 0 0 0 1.19.79h.14a1.6 1.6 0 0 1 0 3.2h-.07a1.3 1.3 0 0 0-1.19.79Z"/></svg>
    </button>
  </div>
</header>

<main id="main" aria-live="polite">
  <section class="boot" id="boot">
    <span class="spin" aria-hidden="true"></span><span data-i18n="boot">Looking for videos on this page</span>
  </section>

  <section class="notice" id="notice" hidden>
    <h2 id="noticeTitle" data-i18n="notice.error.title">Something went wrong</h2>
    <p id="noticeText"></p>
    <button class="btn" id="noticeBtn" type="button" hidden></button>
  </section>

  <section class="tile now" id="now" hidden>
    <div class="now-h">
      <span class="dot" aria-hidden="true"></span>
      <div class="now-t"><b id="nowLabel"></b><small id="nowMeta"></small></div>
      <button class="round" type="button" id="nowHide" aria-pressed="false" data-i18n-label="now.hide">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2 10s3-6 8-6 8 6 8 6-3 6-8 6-8-6-8-6Z"/><circle cx="10" cy="10" r="2.5"/></svg>
      </button>
      <button class="round" type="button" id="nowRemove" data-i18n-label="now.remove">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5 5 15"/></svg>
      </button>
    </div>
    <fieldset class="sync">
      <legend class="sr" data-i18n="now.sync">Sync</legend>
      <button type="button" dir="ltr" data-shift="-1000" data-i18n-title="now.earlier1">-1</button>
      <button type="button" dir="ltr" data-shift="-100" data-i18n-title="now.earlier01">-0.1</button>
      <output id="nowOffset" dir="ltr">0 s</output>
      <button type="button" dir="ltr" data-shift="100" data-i18n-title="now.later01">+0.1</button>
      <button type="button" dir="ltr" data-shift="1000" data-i18n-title="now.later1">+1</button>
      <button class="link" type="button" id="nowReset" data-i18n="now.reset" hidden>Reset</button>
    </fieldset>
  </section>

  <section class="videos" id="videos" hidden>
    <h2 class="caption" data-i18n="videos.title">Videos on this page</h2>
    <div class="tile vlist" id="vlist" role="radiogroup"></div>
  </section>

  <form class="search" id="search" hidden autocomplete="off">
    <div class="field">
      <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.6" cy="8.6" r="5.6"/><path d="m13 13 4 4"/></svg>
      <input id="q" type="search" spellcheck="false" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="suggest" data-i18n-ph="search.placeholder">
      <button class="go" type="submit" id="go" data-i18n="search.go">Search</button>
    </div>
    <input type="hidden" id="year">
    <input type="hidden" id="season">
    <input type="hidden" id="episode">
    <!-- biome-ignore lint/a11y/noNoninteractiveElementToInteractiveRole: a list of options is the ARIA combobox pattern. -->
    <ul class="tile list sugg" id="suggest" role="listbox" hidden></ul>
    <p class="from" id="from"></p>
  </form>

  <section class="hero" id="hero" hidden>
    <div class="hero-bg" id="heroBg" aria-hidden="true"></div>
    <button class="pill glass" type="button" id="heroBack">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4 6.5 10l6 6"/></svg><span data-i18n="search.back">Search</span>
    </button>
    <div class="hero-row">
      <span class="poster" id="heroPoster" aria-hidden="true"></span>
      <div class="match" id="match"><b></b><small></small></div>
    </div>
  </section>

  <section class="eps" id="eps" hidden>
    <div class="chips" id="seasonChips" role="radiogroup" data-i18n-label="eps.seasons"></div>
    <div class="chips scroll" id="episodeChips" role="radiogroup" data-i18n-label="eps.episodes"></div>
  </section>

  <section class="results" id="results" hidden>
    <div class="rhead">
      <span class="caption" id="rcount"></span>
      <label class="langpick"><span class="sr" data-i18n="res.lang">Subtitle language</span><select id="lang"></select></label>
    </div>
    <ol class="tile list" id="list"></ol>
    <p class="rstate" id="rstate" hidden></p>
  </section>

  <section class="tile ai" id="ai" hidden>
    <div class="ai-h">
      <h2 data-i18n="ai.title">AI subtitles</h2>
      <span class="badge" data-i18n="ai.badge">On this device</span>
    </div>
    <p class="ai-d" data-i18n="ai.desc"></p>
    <div class="ai-opts" id="aiOpts">
      <fieldset class="seg">
        <legend class="sr" data-i18n="ai.quality">Quality</legend>
        <label><input type="radio" name="q" value="fast"><span><span data-i18n="ai.fast">Fast</span><small>44 MB</small></span></label>
        <label><input type="radio" name="q" value="balanced"><span><span data-i18n="ai.balanced">Balanced</span><small>125 MB</small></span></label>
        <label><input type="radio" name="q" value="best"><span><span data-i18n="ai.best">Best</span><small>346 MB</small></span></label>
      </fieldset>
      <label class="row"><span data-i18n="ai.spoken">Spoken language</span><select id="spoken"></select></label>
      <p class="ai-why" id="aiWhy" hidden></p>
      <button class="btn wide" type="button" id="aiStart" data-i18n="ai.start">Start AI subtitles</button>
    </div>
    <div class="ai-run" id="aiRun" hidden>
      <div class="meter" aria-hidden="true"><i id="aiBar"></i></div>
      <p class="ai-s" id="aiText" role="status"></p>
      <button class="btn ghost wide" type="button" id="aiStop" data-i18n="ai.stop">Stop</button>
    </div>
  </section>
</main>

<section class="page" id="look" hidden>
  <div class="preview" id="lkPreview" aria-hidden="true"><span id="lkSample" data-i18n="style.sample"></span></div>
  <fieldset class="chips presets" id="presets">
    <legend class="sr" data-i18n="style.presets">Presets</legend>
    <button type="button" aria-pressed="false" data-preset="classic" data-i18n="preset.classic">Classic</button>
    <button type="button" aria-pressed="false" data-preset="large" data-i18n="preset.large">Large text</button>
    <button type="button" aria-pressed="false" data-preset="outline" data-i18n="preset.outline">Outline</button>
    <button type="button" aria-pressed="false" data-preset="clear" data-i18n="preset.clear">No background</button>
    <button type="button" aria-pressed="false" data-preset="yellow" data-i18n="preset.yellow">Yellow</button>
  </fieldset>
  <div class="tile list form">
    <label class="row"><span data-i18n="style.font">Font</span>
      <select id="lkFont">
        <option value="system" data-i18n="font.system">System</option>
        <option value="serif" data-i18n="font.serif">Serif</option>
        <option value="rounded" data-i18n="font.rounded">Rounded</option>
        <option value="mono" data-i18n="font.mono">Monospace</option>
      </select>
    </label>
    <fieldset class="row stack">
      <legend class="sr" data-i18n="style.weight">Weight</legend>
      <div class="seg">
        <label><input type="radio" name="weight" value="400"><span data-i18n="weight.400">Regular</span></label>
        <label><input type="radio" name="weight" value="500"><span data-i18n="weight.500">Medium</span></label>
        <label><input type="radio" name="weight" value="700"><span data-i18n="weight.700">Bold</span></label>
      </div>
    </fieldset>
    <label class="row stack slide"><span><span data-i18n="style.size">Size</span><output id="lkSizeOut"></output></span><input type="range" id="lkSize" min="2.5" max="9" step="0.1"></label>
    <fieldset class="row swatches" id="lkColors"><legend data-i18n="style.color">Text colour</legend></fieldset>
    <label class="row"><span data-i18n="style.edge">Text edge</span>
      <select id="lkEdge">
        <option value="none" data-i18n="edge.none">None</option>
        <option value="shadow" data-i18n="edge.shadow">Drop shadow</option>
        <option value="outline" data-i18n="edge.outline">Outline</option>
        <option value="raised" data-i18n="edge.raised">Raised</option>
        <option value="depressed" data-i18n="edge.depressed">Depressed</option>
      </select>
    </label>
    <fieldset class="row swatches" id="lkBoxColors"><legend data-i18n="style.boxColor">Background colour</legend></fieldset>
    <label class="row stack slide"><span><span data-i18n="style.box">Background opacity</span><output id="lkBoxOut"></output></span><input type="range" id="lkBox" min="0" max="1" step="0.05"></label>
    <label class="row stack slide"><span><span data-i18n="style.bottom">Height</span><output id="lkBottomOut"></output></span><input type="range" id="lkBottom" min="2" max="40" step="1"></label>
  </div>
  <button class="btn ghost wide" type="button" id="lkReset" data-i18n="style.reset">Reset</button>
</section>

<section class="page" id="settings" hidden>
  <h2 class="caption" data-i18n="settings.appearance">Appearance</h2>
  <div class="tile pad">
    <div class="seg" role="radiogroup" data-i18n-label="settings.appearance">
      <label><input type="radio" name="theme" value="dark"><span data-i18n="theme.dark">Dark</span></label>
      <label><input type="radio" name="theme" value="light"><span data-i18n="theme.light">Light</span></label>
      <label><input type="radio" name="theme" value="auto"><span data-i18n="theme.auto">Automatic</span></label>
    </div>
  </div>
  <h2 class="caption" data-i18n="settings.language">Language</h2>
  <div class="tile list form">
    <label class="row"><span data-i18n="settings.ui">Interface</span><select id="uiLang"></select></label>
  </div>
  <h2 class="caption" data-i18n="settings.subtitles">Subtitles</h2>
  <div class="tile list form">
    <label class="row"><span data-i18n="settings.hi">Hearing-impaired text</span>
      <select id="hiMode">
        <option value="show" data-i18n="hi.show">Show</option>
        <option value="remove" data-i18n="hi.remove">Remove</option>
      </select>
    </label>
    <label class="row"><span data-i18n="settings.bar">Control bar on the video</span><input type="checkbox" class="switch" id="barOn"></label>
  </div>
  <p class="note" data-i18n="settings.barNote"></p>
</section>

<footer class="foot" id="foot">
  <label class="file" id="fileBtn" hidden>
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 13V3m0 0L6.5 6.5M10 3l3.5 3.5M3.5 13v2.5a1.5 1.5 0 0 0 1.5 1.5h10a1.5 1.5 0 0 0 1.5-1.5V13"/></svg>
    <span data-i18n="file.load">Load a subtitle file</span><input type="file" id="file" accept=".srt,.vtt,.ass,.ssa,.txt">
  </label>
  <a id="site" href="https://thesubtitledb.org" target="_blank" rel="noopener">thesubtitledb.org</a>
</footer>
<script src="popup.js"></script>
</body>
</html>
